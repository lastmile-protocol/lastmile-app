name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    name: the wallet works, including offline
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test

  offline:
    runs-on: ubuntu-latest
    name: nothing is fetched from the network
    steps:
      - uses: actions/checkout@v5
      # A wallet that has to reach a CDN to draw itself is not an offline
      # wallet. Every byte the page needs must be in this repository.
      - name: no remote scripts, styles, fonts or images
        run: |
          if grep -nE '(src|href)="[^"]*//' index.html app.js lastmile.js sw.js; then
            echo "::error::the wallet must load everything from this repository"
            exit 1
          fi
      - name: the service worker caches every file the page needs
        run: |
          for f in index.html app.js lastmile.js manifest.webmanifest icon.svg; do
            grep -q "$f" sw.js || { echo "::error::$f is not in the service worker cache list"; exit 1; }
          done
          echo "all files are cached for offline use"
